<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Idle Button — ButtonCorp™</title>
  <meta name="description" content="Press the button, build your ButtonCorp™ empire, research breakthroughs, and uncover what is really happening beneath the office." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell" id="app-shell">
    <!-- Top Header (hidden at very start) -->
    <header class="top-bar is-hidden" id="top-bar">
      <div class="brand-cluster">
        <span class="status-led" id="status-led" aria-hidden="true"></span>
        <span class="brand-name mono" id="brand-name">BUTTONCORP™</span>
        <span class="phase-tag mono" id="phase-tag">INTERNSHIP</span>
      </div>

      <div class="top-stats mono">
        <span class="stat-pill is-hidden" id="pill-rp">RP: <strong id="top-rp">0</strong></span>
        <span class="stat-pill is-hidden" id="pill-shares">SHARES: <strong id="top-shares">0</strong></span>
      </div>

      <div class="top-controls">
        <button class="icon-btn mono" id="btn-sound" type="button">AUDIO: ON</button>
        <button class="icon-btn mono" id="btn-reset" type="button">RESET</button>
      </div>
    </header>

    <!-- Main 2-Column Workspace -->
    <main class="workspace" id="workspace">
      <!-- Left Column: Button, Balance, Active Abilities, Ticker -->
      <section class="left-column" aria-label="Button Station">
        <div class="currency-card">
          <div class="currency-label mono is-hidden" id="currency-label">CORPORATE FUNDS</div>
          <div class="currency-value mono" id="currency-value">$0.00</div>
          <div class="currency-rates mono is-hidden" id="currency-rates">
            <span id="rate-money">+$0.00 / sec</span>
            <span class="rate-sep is-hidden" id="rate-rp-sep">•</span>
            <span class="is-hidden" id="rate-rp">+0.0 RP / sec</span>
          </div>
        </div>

        <div class="button-housing" id="button-housing">
          <div class="housing-screws" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
          <button class="main-button" id="main-button" type="button" aria-label="Press button">
            <span class="button-cap">
              <span class="button-label mono" id="button-label">PRESS</span>
              <span class="button-sub mono is-hidden" id="button-sub">+$1.00</span>
            </span>
          </button>
          <div class="floating-layer" id="floating-layer" aria-hidden="true"></div>
        </div>

        <!-- Active Abilities (Magic Research inspired, unlocked via Research) -->
        <div class="abilities-bar is-hidden" id="abilities-bar">
          <div class="section-mini-title mono">ACTIVE PROTOCOLS</div>
          <div class="abilities-grid" id="abilities-grid"></div>
        </div>

        <!-- Compact Story / Memo Feed (unlocked at Phase 1) -->
        <div class="memo-box is-hidden" id="memo-box">
          <div class="memo-header">
            <span class="mono" id="memo-title">COMPANY MEMO</span>
            <span class="memo-count mono" id="memo-count">0</span>
          </div>
          <div class="memo-feed" id="memo-feed" role="log" aria-live="polite"></div>
        </div>
      </section>

      <!-- Right Column: Tabbed Panels (Operations, Upgrades, Research, Prestige) -->
      <section class="right-column is-hidden" id="right-column" aria-label="Management Console">
        <nav class="tab-bar" role="tablist">
          <button class="tab-btn mono active" data-tab="operations" id="tab-btn-operations" role="tab" aria-selected="true">
            OPERATIONS
          </button>
          <button class="tab-btn mono is-hidden" data-tab="upgrades" id="tab-btn-upgrades" role="tab" aria-selected="false">
            UPGRADES <span class="tab-badge is-hidden" id="badge-upgrades">0</span>
          </button>
          <button class="tab-btn mono is-hidden" data-tab="research" id="tab-btn-research" role="tab" aria-selected="false">
            R&amp;D LAB <span class="tab-badge is-hidden" id="badge-research">!</span>
          </button>
          <button class="tab-btn mono is-hidden" data-tab="prestige" id="tab-btn-prestige" role="tab" aria-selected="false">
            RESTRUCTURE
          </button>
        </nav>

        <!-- Panel 1: Operations (AdCap / AdCom style Generators + Managers) -->
        <div class="tab-panel active" id="panel-operations" role="tabpanel">
          <div class="panel-toolbar">
            <span class="toolbar-title mono">BUTTON DIVISIONS</span>
            <div class="buy-mode-group" id="buy-mode-group">
              <button class="mode-btn mono active" data-mode="1" type="button">x1</button>
              <button class="mode-btn mono" data-mode="10" type="button">x10</button>
              <button class="mode-btn mono" data-mode="max" type="button">MAX</button>
            </div>
          </div>
          <div class="generators-list" id="generators-list"></div>
        </div>

        <!-- Panel 2: Dedicated Upgrades Panel -->
        <div class="tab-panel" id="panel-upgrades" role="tabpanel">
          <div class="panel-toolbar">
            <span class="toolbar-title mono">PURCHASE UPGRADES</span>
            <span class="toolbar-meta mono" id="upgrades-summary">0 / 0 OWNED</span>
          </div>
          <div class="upgrades-sections">
            <div class="upgrade-group-label mono">MANAGERS &amp; AUTOMATION</div>
            <div class="upgrades-grid" id="managers-list"></div>
            <div class="upgrade-group-label mono">EQUIPMENT &amp; SYNERGY</div>
            <div class="upgrades-grid" id="upgrades-list"></div>
          </div>
        </div>

        <!-- Panel 3: R&D Lab (Magic Research inspired) -->
        <div class="tab-panel" id="panel-research" role="tabpanel">
          <div class="panel-toolbar">
            <span class="toolbar-title mono">RESEARCH &amp; DEVELOPMENT</span>
            <span class="toolbar-meta mono" id="research-rp-display">0.0 RP</span>
          </div>
          <div class="active-research-box" id="active-research-box">
            <div class="mono muted-text">No active project. Select a research topic below.</div>
          </div>
          <div class="research-list" id="research-list"></div>
        </div>

        <!-- Panel 4: Prestige / Restructure -->
        <div class="tab-panel" id="panel-prestige" role="tabpanel">
          <div class="prestige-card" id="prestige-card"></div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
